<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10a37f">
<title>Sign in · Voice Assistant</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>
  :root { --bg: #f6f5f2; --surface: #ffffff; --text: #1d1d1f; --muted: #6e6e73; --accent: #10a37f; --border: #e2e1dc; --danger: #c62828; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111214; --surface: #1b1c1f; --text: #ececf1; --muted: #9a9aa3; --accent: #19c37d; --border: #2c2d31; --danger: #ef5350; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 16px;
    background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  form {
    width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
    padding: 28px 24px; display: flex; flex-direction: column; gap: 14px; text-align: center;
  }
  img { width: 72px; height: 72px; margin: 0 auto; border-radius: 18px; }
  h1 { margin: 0; font-size: 1.3rem; font-weight: 600; }
  p { margin: 0; color: var(--muted); font-size: .9rem; }
  .error { color: var(--danger); }
  input {
    padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg);
    color: var(--text); font: inherit;
  }
  button { padding: 12px; border-radius: 12px; border: none; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
</style>
</head>
<body>
<form method="post" action="/login">
  <img src="/icons/icon.svg" alt="">
  <h1>Voice Assistant</h1>
  <p id="msg">Enter the password to continue.</p>
  <input type="password" name="password" placeholder="Password" autocomplete="current-password" required autofocus>
  <button>Sign in</button>
</form>
<script>
  if (new URLSearchParams(location.search).has("error")) {
    const msg = document.getElementById("msg");
    msg.textContent = "That password didn't work. Try again.";
    msg.classList.add("error");
  }
</script>
</body>
</html>
