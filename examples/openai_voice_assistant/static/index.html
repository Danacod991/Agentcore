<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Assistant">
<title>Voice Assistant</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>
  :root {
    --bg: #f6f5f2; --surface: #ffffff; --text: #1d1d1f; --muted: #6e6e73;
    --accent: #10a37f; --accent-soft: #10a37f22; --user: #e8f0fe; --border: #e2e1dc; --danger: #c62828;
    --scrim: #00000059;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111214; --surface: #1b1c1f; --text: #ececf1; --muted: #9a9aa3;
      --accent: #19c37d; --accent-soft: #19c37d26; --user: #22324a; --border: #2c2d31; --danger: #ef5350;
      --scrim: #000000a6;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; justify-content: center; overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; }
  /* Fill the screen exactly (100dvh tracks mobile browser chrome) and keep clear of notches and home bars. */
  main {
    width: 100%; max-width: 640px; height: 100dvh; display: flex; flex-direction: column; gap: 20px;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
  header .left { display: flex; gap: 4px; }
  header .right { display: flex; gap: 4px; justify-content: flex-end; }
  .titles { text-align: center; min-width: 0; }
  h1 { margin: 0; font-size: 1.3rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #status { color: var(--muted); font-size: .85rem; min-height: 1.4em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #status.error { color: var(--danger); }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 12px; border: none; background: transparent; cursor: pointer;
    display: grid; place-items: center; color: var(--muted);
  }
  .icon-btn:hover { background: var(--surface); color: var(--text); }
  .icon-btn svg { width: 22px; height: 22px; }
  .orb-wrap { display: flex; justify-content: center; padding: 4px 0; }
  #mic {
    width: 120px; height: 120px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--surface); color: var(--accent); box-shadow: 0 0 0 1px var(--border), 0 6px 24px #0000001a;
    display: grid; place-items: center; transition: transform .15s, box-shadow .15s, background .2s;
  }
  #mic:hover { transform: scale(1.03); }
  #mic svg { width: 44px; height: 44px; }
  #mic.live { background: var(--accent); color: #fff; box-shadow: 0 0 0 calc(6px + var(--level, 0) * 26px) var(--accent-soft); }
  #log {
    flex: 1; min-height: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 16px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto;
  }
  #log:empty::before { content: "Tap the mic and say hello."; color: var(--muted); margin: auto; }
  .msg { padding: 8px 12px; border-radius: 12px; max-width: 85%; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--user); }
  .msg.assistant { align-self: flex-start; background: var(--bg); }
  .msg.tool, .msg.divider { align-self: center; color: var(--muted); font-size: .8rem; padding: 0; }
  form.composer { display: flex; gap: 8px; }
  input[type=text], select {
    flex: 1; min-width: 0; padding: 10px 14px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font: inherit;
  }
  .primary {
    padding: 10px 18px; border-radius: 999px; border: none; background: var(--accent); color: #fff; cursor: pointer;
  }
  .ghost { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border); background: transparent; cursor: pointer; }
  .danger, .icon-btn.danger:hover { color: var(--danger); }

  /* Panels: a bottom sheet on phones, a centred card on wider screens. */
  dialog {
    border: none; padding: 0; background: var(--surface); color: var(--text);
    width: 100%; max-width: 560px; max-height: 88dvh; margin: auto auto 0; border-radius: 20px 20px 0 0;
    display: none; flex-direction: column;
  }
  dialog[open] { display: flex; }
  dialog::backdrop { background: var(--scrim); }
  @media (min-width: 700px) { dialog { margin: auto; border-radius: 20px; max-height: 80dvh; } }
  .sheet-head { display: flex; align-items: center; gap: 4px; padding: 12px 12px 0; }
  .tabs { display: flex; gap: 4px; flex: 1; }
  .tab { border: none; background: transparent; padding: 8px 14px; border-radius: 999px; cursor: pointer; color: var(--muted); }
  .tab[aria-selected=true] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .panel {
    padding: 16px 16px max(20px, env(safe-area-inset-bottom)); overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
  }
  .panel[hidden] { display: none; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row.space { justify-content: space-between; }
  .list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .item {
    display: flex; align-items: flex-start; gap: 8px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 12px;
  }
  .item .body { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .item button.open { all: unset; cursor: pointer; display: block; flex: 1; min-width: 0; }
  .item .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { color: var(--muted); font-size: .8rem; }
  .empty { color: var(--muted); text-align: center; padding: 24px 0; }
  .transcript { display: flex; flex-direction: column; gap: 8px; }
  label.field { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: .9rem; }
  label.field .hint { font-weight: 400; color: var(--muted); }
  label.check { display: flex; gap: 10px; align-items: flex-start; }
  label.check input { margin-top: 4px; accent-color: var(--accent); width: 18px; height: 18px; }
</style>
</head>
<body>
<main>
  <header>
    <div class="left">
      <button class="icon-btn" id="historyBtn" aria-label="Conversation history" title="History">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>
      </button>
      <button class="icon-btn" id="newBtn" aria-label="New conversation" title="New conversation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      </button>
    </div>
    <div class="titles">
      <h1 id="title">Voice Assistant</h1>
      <div id="status">Disconnected</div>
    </div>
    <div class="right">
      <button class="icon-btn" id="notesBtn" aria-label="Notes" title="Notes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
      </button>
      <button class="icon-btn" id="settingsBtn" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>
  <div class="orb-wrap">
    <button id="mic" aria-label="Start talking">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 17v5"/>
      </svg>
    </button>
  </div>
  <div id="log" aria-live="polite"></div>
  <form class="composer" id="textForm">
    <input type="text" id="textInput" placeholder="…or type a message" autocomplete="off">
    <button class="primary">Send</button>
  </form>
</main>

<dialog id="sheet" aria-label="Assistant panels">
  <div class="sheet-head">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="history">History</button>
      <button class="tab" role="tab" data-tab="notes">Notes</button>
      <button class="tab" role="tab" data-tab="settings">Settings</button>
    </div>
    <button class="icon-btn" id="closeSheet" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>

  <section class="panel" data-panel="history" role="tabpanel">
    <div id="historyList">
      <div class="row space">
        <span class="meta" id="historyCount"></span>
        <button class="ghost danger" id="clearHistory">Clear all</button>
      </div>
      <ul class="list" id="conversations"></ul>
    </div>
    <div id="historyDetail" hidden>
      <div class="row space">
        <button class="ghost" id="backToList">← All conversations</button>
        <button class="primary" id="resumeBtn">Continue</button>
      </div>
      <p class="meta" id="detailMeta"></p>
      <div class="transcript" id="detailTranscript"></div>
      <div class="row"><button class="ghost danger" id="deleteConversation">Delete conversation</button></div>
    </div>
  </section>

  <section class="panel" data-panel="notes" role="tabpanel" hidden>
    <p class="meta">Things your assistant remembers about you. It adds to this when you ask it to remember something.</p>
    <form class="composer" id="noteForm">
      <input type="text" id="noteInput" placeholder="Add a note" autocomplete="off" maxlength="2000">
      <button class="primary">Add</button>
    </form>
    <ul class="list" id="notesList"></ul>
  </section>

  <section class="panel" data-panel="settings" role="tabpanel" hidden>
    <form id="settingsForm" style="display:flex;flex-direction:column;gap:16px">
      <label class="field">Assistant name
        <input type="text" id="nameInput" maxlength="40" autocomplete="off">
      </label>
      <label class="field">Voice
        <select id="voiceSelect"></select>
      </label>
      <label class="check">
        <input type="checkbox" id="saveHistory">
        <span>Save conversation history<br><span class="meta">Stored only in this browser on this device.</span></span>
      </label>
      <div class="row space">
        <span class="meta" id="settingsSaved"></span>
        <button class="primary">Save</button>
      </div>
    </form>
  </section>
</dialog>

<script>
const SAMPLE_RATE = 24000;
const RESUME_WINDOW_MS = 30 * 60 * 1000; // reopening the mic within 30 min continues the same conversation
const MAX_CONVERSATIONS = 100;
const $ = id => document.getElementById(id);
const micBtn = $("mic"), statusEl = $("status"), logEl = $("log"), sheet = $("sheet");

let ws, audioCtx, micStream, micNode, playhead = 0, sources = [], assistantBubble = null;
let current = null;        // the conversation being recorded: {id, startedAt, updatedAt, messages: [{role, text, at}]}
let viewing = null;        // conversation open in the history detail view
let serverConfig = { voices: [], voice: "", name: "Voice Assistant" };

// ---------- storage (per device; every access guarded because private modes can throw) ----------
const store = {
  get(key, fallback) { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; } },
  set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} },
};
const settings = () => store.get("assistant.settings", { name: "", voice: "", saveHistory: true });
const conversations = () => store.get("assistant.conversations", []);

function saveConversation(conv) {
  if (!settings().saveHistory || !conv.messages.length) return;
  const all = conversations().filter(c => c.id !== conv.id);
  all.unshift(conv);
  store.set("assistant.conversations", all.slice(0, MAX_CONVERSATIONS));
}

function record(role, text) {
  if (!text) return;
  current ??= { id: crypto.randomUUID?.() ?? String(Date.now()), startedAt: Date.now(), messages: [] };
  current.messages.push({ role, text, at: Date.now() });
  current.updatedAt = Date.now();
  saveConversation(current);
}

// ---------- chat log ----------
function setStatus(text, isError = false) {
  statusEl.textContent = text;
  statusEl.classList.toggle("error", isError);
}

function bubble(role, text, container = logEl) {
  const div = document.createElement("div");
  div.className = `msg ${role}`;
  div.textContent = role === "tool" ? `used ${text.replaceAll("_", " ")}` : text;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  return div;
}

function addMessage(role, text) {
  record(role, text);
  return bubble(role, text);
}

function showConversation(conv) {
  logEl.replaceChildren();
  for (const m of conv?.messages ?? []) bubble(m.role, m.text);
}

function newConversation() {
  current = null;
  assistantBubble = null;
  logEl.replaceChildren();
}

// ---------- audio ----------
// Recorder worklet: batches Float32 mic samples into ~100 ms chunks and posts them to the main thread.
const workletSource = `
class Recorder extends AudioWorkletProcessor {
  constructor() { super(); this.buf = []; this.len = 0; }
  process(inputs) {
    const ch = inputs[0][0];
    if (ch) {
      this.buf.push(ch.slice()); this.len += ch.length;
      if (this.len >= ${SAMPLE_RATE / 10}) {
        const out = new Float32Array(this.len); let o = 0;
        for (const b of this.buf) { out.set(b, o); o += b.length; }
        this.port.postMessage(out); this.buf = []; this.len = 0;
      }
    }
    return true;
  }
}
registerProcessor("recorder", Recorder);`;

function floatToPcm16Base64(float32) {
  const pcm = new Int16Array(float32.length);
  let peak = 0;
  for (let i = 0; i < float32.length; i++) {
    const s = Math.max(-1, Math.min(1, float32[i]));
    pcm[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
    peak = Math.max(peak, Math.abs(s));
  }
  micBtn.style.setProperty("--level", Math.min(1, peak * 2).toFixed(2));
  let binary = "";
  const bytes = new Uint8Array(pcm.buffer);
  for (let i = 0; i < bytes.length; i += 0x8000) binary += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(binary);
}

function playPcm16Base64(b64) {
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const pcm = new Int16Array(bytes.buffer, 0, bytes.length >> 1);
  const buffer = audioCtx.createBuffer(1, pcm.length, SAMPLE_RATE);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < pcm.length; i++) data[i] = pcm[i] / 0x8000;
  const src = audioCtx.createBufferSource();
  src.buffer = buffer;
  src.connect(audioCtx.destination);
  playhead = Math.max(playhead, audioCtx.currentTime);
  src.start(playhead);
  playhead += buffer.duration;
  sources.push(src);
  src.onended = () => { sources = sources.filter(s => s !== src); };
}

function stopPlayback() {
  for (const s of sources) { try { s.stop(); } catch {} }
  sources = [];
  playhead = 0;
}

// ---------- connection ----------
function handleServerMessage(msg) {
  switch (msg.type) {
    case "ready": setStatus("Listening…"); break;
    case "audio": playPcm16Base64(msg.audio); break;
    case "interrupt": stopPlayback(); assistantBubble = null; break;
    case "transcript":
      if (msg.role === "user") { addMessage("user", msg.text); break; }
      if (!assistantBubble) assistantBubble = bubble("assistant", "");
      if (msg.final) { assistantBubble.textContent = msg.text; record("assistant", msg.text); assistantBubble = null; }
      else assistantBubble.textContent += msg.delta;
      logEl.scrollTop = logEl.scrollHeight;
      break;
    case "tool":
      addMessage("tool", msg.name);
      if (msg.name.endsWith("_note") && sheet.open) loadNotes();
      break;
    case "error": setStatus(msg.message, true); break;
  }
}

function openSocket() {
  const { voice, name } = settings();
  const query = new URLSearchParams();
  if (voice) query.set("voice", voice);
  if (name) query.set("name", name);
  return new Promise((resolve, reject) => {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    ws = new WebSocket(`${proto}://${location.host}/ws?${query}`);
    ws.onopen = () => resolve();
    ws.onerror = () => reject(new Error("WebSocket connection failed"));
    ws.onmessage = e => handleServerMessage(JSON.parse(e.data));
    ws.onclose = () => { if (micStream) stop(); setStatus("Disconnected"); };
  });
}

// When a password is set and the session cookie has expired, the page redirects to /login.
async function signedOut() {
  try {
    const res = await fetch("/", { redirect: "manual", cache: "no-store" });
    return res.type === "opaqueredirect";
  } catch { return false; }
}

async function start() {
  // A fresh realtime session knows nothing, so carry over the conversation on screen if it's recent.
  if (current && Date.now() - current.updatedAt > RESUME_WINDOW_MS) newConversation();
  setStatus("Connecting…");
  try {
    audioCtx = new AudioContext({ sampleRate: SAMPLE_RATE });
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    });
    await audioCtx.audioWorklet.addModule(URL.createObjectURL(new Blob([workletSource], { type: "text/javascript" })));
    await openSocket();
    if (current?.messages.length) {
      ws.send(JSON.stringify({ type: "history", messages: current.messages.map(({ role, text }) => ({ role, text })) }));
    }
    const input = audioCtx.createMediaStreamSource(micStream);
    micNode = new AudioWorkletNode(audioCtx, "recorder");
    micNode.port.onmessage = e => {
      if (ws?.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "audio", audio: floatToPcm16Base64(e.data) }));
    };
    input.connect(micNode);
    micBtn.classList.add("live");
    micBtn.setAttribute("aria-label", "Stop talking");
  } catch (err) {
    stop();
    if (await signedOut()) return void location.assign("/login");
    setStatus(err.message || String(err), true);
  }
}

function stop() {
  micNode?.disconnect(); micNode = null;
  micStream?.getTracks().forEach(t => t.stop()); micStream = null;
  stopPlayback();
  if (ws && ws.readyState <= WebSocket.OPEN) ws.close();
  audioCtx?.close(); audioCtx = null;
  micBtn.classList.remove("live");
  micBtn.style.removeProperty("--level");
  micBtn.setAttribute("aria-label", "Start talking");
}

async function restart() {
  if (!micStream) return;
  stop();
  await start();
}

micBtn.addEventListener("click", () => (micStream ? stop() : start()));

$("newBtn").addEventListener("click", async () => {
  newConversation();
  await restart();
});

// Release the mic when the app is backgrounded on a phone, so it isn't left listening.
document.addEventListener("visibilitychange", () => { if (document.hidden && micStream) stop(); });

if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});

$("textForm").addEventListener("submit", async e => {
  e.preventDefault();
  const text = $("textInput").value.trim();
  if (!text) return;
  if (!micStream) await start();
  if (ws?.readyState !== WebSocket.OPEN) return;
  addMessage("user", text);
  ws.send(JSON.stringify({ type: "text", text }));
  $("textInput").value = "";
});

// ---------- panels ----------
function openPanel(tab) {
  for (const t of sheet.querySelectorAll(".tab")) t.setAttribute("aria-selected", t.dataset.tab === tab);
  for (const p of sheet.querySelectorAll(".panel")) p.hidden = p.dataset.panel !== tab;
  if (tab === "history") renderHistory();
  if (tab === "notes") loadNotes();
  if (tab === "settings") renderSettings();
  if (!sheet.open) sheet.showModal();
}

$("historyBtn").addEventListener("click", () => openPanel("history"));
$("notesBtn").addEventListener("click", () => openPanel("notes"));
$("settingsBtn").addEventListener("click", () => openPanel("settings"));
$("closeSheet").addEventListener("click", () => sheet.close());
sheet.addEventListener("click", e => { if (e.target === sheet) sheet.close(); }); // tap the backdrop to close
for (const t of sheet.querySelectorAll(".tab")) t.addEventListener("click", () => openPanel(t.dataset.tab));

function formatWhen(ms) {
  const d = new Date(ms), today = new Date();
  const time = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  if (d.toDateString() === today.toDateString()) return `Today, ${time}`;
  return `${d.toLocaleDateString([], { month: "short", day: "numeric", year: d.getFullYear() === today.getFullYear() ? undefined : "numeric" })}, ${time}`;
}

function listItem(children, actionLabel, onAction) {
  const li = document.createElement("li");
  li.className = "item";
  li.append(...children);
  if (onAction) {
    const del = document.createElement("button");
    del.className = "icon-btn danger";
    del.setAttribute("aria-label", actionLabel);
    del.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>';
    del.addEventListener("click", onAction);
    li.append(del);
  }
  return li;
}

function renderHistory() {
  $("historyList").hidden = false;
  $("historyDetail").hidden = true;
  const all = conversations();
  const ul = $("conversations");
  ul.replaceChildren();
  $("historyCount").textContent = all.length ? `${all.length} conversation${all.length === 1 ? "" : "s"}` : "";
  $("clearHistory").hidden = !all.length;
  if (!all.length) {
    const li = document.createElement("li");
    li.className = "empty";
    li.textContent = settings().saveHistory ? "No conversations yet." : "History is turned off in Settings.";
    return void ul.append(li);
  }
  for (const conv of all) {
    const open = document.createElement("button");
    open.className = "open";
    const first = conv.messages.find(m => m.role === "user") ?? conv.messages[0];
    const title = document.createElement("div");
    title.className = "title";
    title.textContent = first?.text || "Conversation";
    const meta = document.createElement("div");
    meta.className = "meta";
    const spoken = conv.messages.filter(m => m.role !== "tool").length;
    meta.textContent = `${formatWhen(conv.updatedAt ?? conv.startedAt)} · ${spoken} message${spoken === 1 ? "" : "s"}`;
    open.append(title, meta);
    open.addEventListener("click", () => showDetail(conv));
    ul.append(listItem([open], "Delete conversation", () => deleteConversation(conv.id)));
  }
}

function showDetail(conv) {
  viewing = conv;
  $("historyList").hidden = true;
  $("historyDetail").hidden = false;
  $("detailMeta").textContent = `Started ${formatWhen(conv.startedAt)}`;
  const box = $("detailTranscript");
  box.replaceChildren();
  for (const m of conv.messages) bubble(m.role, m.text, box);
}

function deleteConversation(id) {
  store.set("assistant.conversations", conversations().filter(c => c.id !== id));
  if (current?.id === id) current = null;
  renderHistory();
}

$("backToList").addEventListener("click", renderHistory);
$("deleteConversation").addEventListener("click", () => viewing && deleteConversation(viewing.id));
$("clearHistory").addEventListener("click", () => {
  if (!confirm("Delete all saved conversations on this device?")) return;
  store.set("assistant.conversations", []);
  current = null;
  renderHistory();
});
$("resumeBtn").addEventListener("click", async () => {
  if (!viewing) return;
  current = { ...viewing, messages: [...viewing.messages], updatedAt: Date.now() };
  showConversation(current);
  bubble("divider", "Continuing this conversation");
  sheet.close();
  if (micStream) await restart(); else await start();
});

// Notes are stored on the server, shared with the assistant's save_note / list_notes tools.
async function api(path, options = {}) {
  const res = await fetch(path, { headers: { "content-type": "application/json" }, ...options });
  if (res.status === 401) { location.assign("/login"); throw new Error("Signed out"); }
  return res.json();
}

async function loadNotes() {
  const ul = $("notesList");
  try {
    const { notes } = await api("/api/notes");
    ul.replaceChildren();
    if (!notes.length) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = "No notes yet. Try saying “Remember that I like my coffee black.”";
      return void ul.append(li);
    }
    for (const note of [...notes].reverse()) {
      const body = document.createElement("div");
      body.className = "body";
      const text = document.createElement("div");
      text.textContent = note.text;
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = formatWhen(Date.parse(note.created_at));
      body.append(text, meta);
      ul.append(listItem([body], "Delete note", async () => {
        await api(`/api/notes/${note.id}`, { method: "DELETE" });
        loadNotes();
      }));
    }
  } catch (err) {
    ul.replaceChildren(Object.assign(document.createElement("li"), { className: "empty", textContent: "Couldn't load notes." }));
  }
}

$("noteForm").addEventListener("submit", async e => {
  e.preventDefault();
  const text = $("noteInput").value.trim();
  if (!text) return;
  await api("/api/notes", { method: "POST", body: JSON.stringify({ text }) });
  $("noteInput").value = "";
  loadNotes();
});

// Settings are kept in this browser and sent to the server when a voice session opens.
function renderSettings() {
  const s = settings();
  $("nameInput").value = s.name;
  $("nameInput").placeholder = serverConfig.name;
  const select = $("voiceSelect");
  select.replaceChildren(...serverConfig.voices.map(v => {
    const label = v[0].toUpperCase() + v.slice(1) + (v === serverConfig.voice ? " (default)" : "");
    return new Option(label, v, false, v === (s.voice || serverConfig.voice));
  }));
  $("saveHistory").checked = s.saveHistory;
  $("settingsSaved").textContent = "";
}

function applyTitle() {
  const name = settings().name || serverConfig.name;
  $("title").textContent = name;
  document.title = name;
}

$("settingsForm").addEventListener("submit", async e => {
  e.preventDefault();
  const voice = $("voiceSelect").value;
  const next = {
    name: $("nameInput").value.trim(),
    voice: voice === serverConfig.voice ? "" : voice,
    saveHistory: $("saveHistory").checked,
  };
  const changedVoice = next.name !== settings().name || next.voice !== settings().voice;
  store.set("assistant.settings", next);
  applyTitle();
  $("settingsSaved").textContent = micStream && changedVoice ? "Saved. Reconnecting…" : "Saved.";
  if (micStream && changedVoice) await restart();
});

api("/api/config").then(cfg => { serverConfig = cfg; applyTitle(); }).catch(() => {});
applyTitle();

// Reopening the app shortly after a chat picks up where you left off.
const last = conversations()[0];
if (last && Date.now() - (last.updatedAt ?? 0) < RESUME_WINDOW_MS) { current = last; showConversation(last); }
</script>
</body>
</html>
